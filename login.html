<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — C-Metrics Clinical Software</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    /* Nền xanh tối lạnh chuyên sâu đồng bộ */
    background: linear-gradient(rgba(3, 7, 18, 0.85), rgba(3, 7, 18, 0.85)), url('chillhouse.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between selection:bg-teal-500 selection:text-white overflow-x-hidden">

    <!-- HEADER / NAVBAR -->
    <header class="w-full px-6 py-6 flex items-center justify-between">
        <!-- Logo C-Metrics -->
        <a href="index.html" class="flex items-center space-x-3 group">
            <div class="w-10 h-10 rounded-full border border-white/40 flex items-center justify-center bg-white/10 backdrop-blur-md shadow-sm group-hover:bg-white/20 transition-all">
                <span class="font-bold text-lg text-white tracking-wider">C</span>
            </div>
            <span class="text-xl font-bold tracking-tight text-white">C-Metrics</span>
        </a>

        <!-- Nút quay lại trang chủ -->
        <div>
            <a href="index.html" class="px-5 py-2.5 rounded-full bg-white/10 hover:bg-white/25 text-white text-sm font-medium border border-white/20 backdrop-blur-md transition-all shadow-sm">
                <i class="fa-solid fa-arrow-left mr-2"></i> Trở về Trang chủ
            </a>
        </div>
    </header>

    <!-- MAIN CONTAINER - FORM ĐĂNG NHẬP -->
    <main class="flex-grow flex items-center justify-center px-4 py-12 z-10 w-full">
        <div class="w-full max-w-md rounded-3xl bg-slate-950/75 backdrop-blur-2xl border border-white/15 shadow-2xl p-8">
            
            <!-- Tiêu đề form -->
            <div class="text-center mb-8">
                <div class="inline-flex w-12 h-12 rounded-2xl bg-white/10 items-center justify-center mb-3 border border-white/20 shadow-inner">
                    <i class="fa-solid fa-lock text-white text-xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Đăng Nhập Hệ Thống</h1>
                <p class="text-sm text-slate-300 mt-1">Dành riêng cho chuyên viên lâm sàng và nhà thực hành</p>
            </div>

            <!-- Form xử lý -->
            <form action="#" method="POST" class="space-y-5">
                <!-- Ô nhập Email / Tài khoản -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" required placeholder="chuyenxien@c-metrics.vn" class="w-full pl-11 pr-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 focus:bg-white/15 transition-all">
                    </div>
                </div>

                <!-- Ô nhập Mật khẩu -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300">Mật khẩu</label>
                        <a href="#" class="text-xs text-teal-300 hover:text-white transition-colors">Quên mật khẩu?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 focus:bg-white/15 transition-all">
                    </div>
                </div>

                <!-- Nút Submit -->
                <button type="submit" class="w-full py-3.5 px-4 rounded-xl bg-white text-[#204a56] font-bold text-sm hover:bg-teal-50 transition-all shadow-lg hover:shadow-xl active:scale-[0.99]">
                    Truy cập Trợ lý Lâm sàng
                </button>
            </form>

            <a href="workspace.html" class="w-full mt-3 py-2.5 px-4 rounded-xl bg-white/10 hover:bg-white/20 text-teal-200 border border-teal-500/30 font-semibold text-xs transition-all text-center block shadow-md">
    <i class="fa-solid fa-bolt mr-1 text-amber-300"></i> Vào nhanh Workspace (Demo trực tiếp)
</a>

            <!-- Chân form đăng ký phụ -->
            <div class="mt-6 text-center text-sm text-slate-300">
                Chưa có tài khoản ? 
                <a href="#" class="text-white font-semibold hover:underline ml-1">Đăng ký cấp quyền</a>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="w-full py-6 text-center text-xs text-slate-400 border-t border-white/10 z-10 backdrop-blur-sm">
        2026 C-Metrics Technologies Inc. All rights reserved.
    </footer>

</body>
</html>
